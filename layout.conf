# ==========================================
# SHARK-OS VISUAL LAYOUT CONFIGURATION
# Edit the values below right in GitHub!
# ==========================================

# Theme & Icons (Options: Arc-Dark, Arc, Materia-dark, Materia, Adwaita-dark)
GTK_THEME="Arc-Dark"
WINDOW_BORDER="Arc-Dark"
ICON_THEME="Papirus-Dark"

# Main Panel Position (Options: top, bottom, left, right)
PANEL_POSITION="bottom"
PANEL_SIZE=34
PANEL_DARK_MODE=true

# Bottom Mac-Style Dock (Options: true, false)
ENABLE_PLANK_DOCK=true

# Desktop Wallpaper URL (Direct link to any .jpg or .png image, or leave blank)
WALLPAPER_URL="default_background.jpeg"
